# FreeRADIUS 3.x proxy.conf: realms handled locally, nothing proxied.
#
# Install as /etc/raddb/proxy.conf. This replaces the stock file, which only
# contains examples (realm example.com, home server localhost).
#
# With the stock "suffix" module in the authorize section of
# sites-enabled/default, a User-Name of "8944000000000000031@fleet-c.example.net"
# is split into:
#     Realm              = "fleet-c.example.net"
#     Stripped-User-Name = "8944000000000000031"
# The files module looks up Stripped-User-Name (falling back to User-Name), so
# the users file can match the bare SIM identity and test the Realm separately.
#
# A realm with no auth_pool is handled by this server. A realm that is NOT
# listed here is simply ignored by "suffix": the full User-Name is then used
# as the lookup key.

proxy server {
	default_fallback = no
}

realm LOCAL {
}

# Example: one realm per fleet, customer or APN, as agreed with your provider.
realm fleet-c.example.net {
	# "nostrip" would keep the realm on the lookup key. Leave it out to
	# match the bare SIM identity in the users file.
}
