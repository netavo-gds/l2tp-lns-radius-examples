# FreeRADIUS 3.x clients.conf for an L2TP data SIM deployment.
#
# Your LNS is the RADIUS client (the NAS). The LAC that tunnels the SIM sessions
# to you never talks to your RADIUS directly, so it does NOT go in this file.
#
# Install as /etc/raddb/clients.conf (or /etc/freeradius/3.0/clients.conf on
# Debian/Ubuntu). This replaces the stock file, including its localhost client;
# add one back if you want to run radtest on the RADIUS server itself.
#
# Addresses are documentation addresses (RFC 5737). Secrets are placeholders.

client lns1 {
	# The source address the LNS sends RADIUS from. If the LNS has several
	# addresses, pin its RADIUS source address (accel-ppp: nas-ip-address /
	# bind; RouterOS: /radius src-address) so it matches this entry.
	ipaddr = 192.0.2.10

	# Must match the secret configured on the LNS, byte for byte.
	# Use a long random value in production.
	secret = testing123-CHANGE-ME

	shortname = lns1
	nas_type = other

	# FreeRADIUS 3.2.5+ (BlastRADIUS hardening). Once you have confirmed your
	# LNS sends Message-Authenticator in every Access-Request, set this to
	# "yes". Left at the server default here so older LNS software works.
	# require_message_authenticator = yes
}

# A second LNS for resilience. Each LNS needs its own entry (or share a
# subnet entry such as "ipaddr = 192.0.2.0/28" if they share a secret).
client lns2 {
	ipaddr = 192.0.2.11
	secret = testing123-CHANGE-ME-too
	shortname = lns2
	nas_type = other
}
