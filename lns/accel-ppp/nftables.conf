#!/usr/sbin/nft -f
# nftables rules for an accel-ppp L2TP LNS.
#
# 1. Accept L2TP (UDP 1701) only from the provider's LACs.
# 2. Clamp TCP MSS on traffic through the PPP sessions, because accel-ppp does
#    not do it itself and tunnelled mobile data has a smaller MTU than the
#    hosts at either end assume.
#
# Load with: nft -f nftables.conf
# These are separate tables so they can sit beside your existing ruleset.
# accel-ppp names PPP interfaces ppp0, ppp1, ... unless you set ifname= in [l2tp].

define LAC_V4 = { 198.51.100.0/28 }

table inet lns_l2tp {
	chain input {
		type filter hook input priority filter; policy accept;
		udp dport 1701 ip saddr $LAC_V4 accept
		udp dport 1701 drop
	}

	chain forward {
		type filter hook forward priority mangle; policy accept;
		iifname "ppp*" tcp flags & (syn | rst) == syn tcp option maxseg size set rt mtu
		oifname "ppp*" tcp flags & (syn | rst) == syn tcp option maxseg size set rt mtu
	}
}
