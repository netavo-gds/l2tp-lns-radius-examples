# accel-ppp as an L2TP LNS for data SIM sessions, authenticated and addressed
# by your own RADIUS server.
#
# Written against accel-ppp built from the accel-ppp/accel-ppp master branch
# (October 2026). Option names are from that version's accel-ppp.conf(5).
#
# Addresses (all documentation/shared ranges, replace with your own):
#   192.0.2.10        this LNS (where the provider's LACs send L2TP, UDP 1701)
#   192.0.2.20        your FreeRADIUS server
#   198.51.100.0/28   the provider's LACs (see nftables.conf)
#   100.64.0.1        LNS-side address of every PPP session
#   100.64.1.0/24     static per-SIM addresses handed out by RADIUS
#   100.64.2.0/24     pool "sims-pool"     (named by RADIUS Framed-Pool)
#   100.64.3.0/24     pool "fleet-c-pool"  (named by RADIUS Framed-Pool)
#
# Kernel modules needed on the host: l2tp_ppp (and its dependencies), pppox.
# accel-ppp does not clamp TCP MSS itself: see nftables.conf beside this file.

[modules]
log_file
radius
l2tp
auth_chap_md5
auth_pap
ippool

[core]
log-error=/var/log/accel-ppp/core.log
thread-count=4

[common]
# One session per username: a SIM that reconnects through a different tunnel
# replaces its old session rather than holding two copies of a static address.
single-session=replace

[ppp]
verbose=1
# Tunnelled mobile data has less room than Ethernet. These keep the PPP MTU
# under what fits in the L2TP/UDP/IP path without fragmentation. Lower them
# further if the tunnel itself rides inside IPsec. See the README.
min-mtu=1280
mtu=1400
mru=1400
ipv4=require
ipv6=deny
lcp-echo-interval=30
lcp-echo-failure=3

[l2tp]
verbose=1
# Only listen on the address the LACs are told to use.
bind=192.0.2.10
# Hostname this LNS sends in SCCRP. Some LACs check it.
host-name=lns1
# Tunnel authentication secret, if the provider uses one. It must match the
# LAC side. Leave unset if tunnel authentication is not used.
secret=CHANGE-ME-tunnel-secret
hello-interval=60
ppp-max-mtu=1400

[radius]
verbose=1
nas-identifier=lns1
# Sent as NAS-IP-Address. Must make sense to your RADIUS (clients.conf).
nas-ip-address=192.0.2.10
# Source address for RADIUS packets, so they match clients.conf.
bind=192.0.2.10
# Local (LNS-side) address of the PPP link when RADIUS returns a static
# Framed-IP-Address.
gw-ip-address=100.64.0.1
server=192.0.2.20,testing123-CHANGE-ME,auth-port=1812,acct-port=1813,req-limit=50,fail-timeout=0,max-fail=10,weight=1
# Accept Disconnect-Message / CoA from your RADIUS (e.g. to kick a SIM off).
dae-server=192.0.2.10:3799,testing123-CHANGE-ME
# Restrict who may send DM/CoA. dae-allowed is in current accel-ppp; older
# releases do not have it, so drop the line if yours rejects it.
dae-allowed=192.0.2.20
# Interim-Update every 5 minutes unless RADIUS sends Acct-Interim-Interval.
acct-interim-interval=300
acct-interim-jitter=30
timeout=3
max-try=3
# Send Message-Authenticator in every Access-Request (BlastRADIUS hardening).
# Lets you set require_message_authenticator = yes in clients.conf.
blast-protection=1

[client-ip-range]
# Source addresses L2TP tunnels may come from: the provider's LACs. accel-ppp
# rejects every incoming L2TP connection if this section is empty.
198.51.100.0/28

[ip-pool]
# Local (LNS-side) address of PPP links that take their address from a pool.
gw-ip-address=100.64.0.1
# The RADIUS attribute that names the pool. Framed-Pool is the default.
attr=Framed-Pool
100.64.2.0/24,name=sims-pool
100.64.3.0/24,name=fleet-c-pool

[log]
log-file=/var/log/accel-ppp/accel-ppp.log
log-emerg=/var/log/accel-ppp/emerg.log
log-fail-file=/var/log/accel-ppp/auth-fail.log
level=3

[cli]
verbose=1
telnet=127.0.0.1:2000
tcp=127.0.0.1:2001
